name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm install` y no `npm ci`: el package-lock.json se genera en Windows y
      # no trae resueltos los binarios nativos de Rollup para Linux
      # (npm/cli#4828). Es el mismo motivo por el que `vercel.json` tampoco usa
      # `npm ci`, y por el que cambiarlo alli rompio produccion.
      - name: Install dependencies
        run: npm install

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (Postgres + Auth)
        run: supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - name: Stop local Supabase
        if: always()
        run: supabase stop
