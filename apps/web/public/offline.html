<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rumbo sin conexion</title>
    <style>
      :root {
        --plum: #6b2948;
        --cream: #fff8f0;
        --gold: #e3a72f;
        --ink: #3b2130;
        --danger: #a8324a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
        background: var(--cream);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        text-align: center;
      }
      #logo {
        width: 84px;
        height: 84px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.25;
        color: var(--plum);
      }
      p {
        margin: 0;
        max-width: 34ch;
        font-size: 16px;
        line-height: 1.5;
        opacity: 0.75;
      }
      button {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: var(--plum);
        color: var(--cream);
        font: inherit;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
      }
      button[aria-busy="true"] {
        opacity: 0.75;
        cursor: progress;
      }
      #enter {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        padding: 0 24px;
        border: 1px solid var(--plum);
        border-radius: 999px;
        background: transparent;
        color: var(--plum);
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      #enter[hidden] {
        display: none;
      }
      /* El disco gira solo mientras se comprueba la conexion. */
      #spinner {
        display: none;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 248, 240, 0.35);
        border-top-color: var(--cream);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      button[aria-busy="true"] #spinner {
        display: block;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #spinner {
          animation-duration: 2.4s;
        }
      }
      /* Ocupa sitio siempre, para que el texto no salte al aparecer el error. */
      #status {
        min-height: 24px;
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        color: var(--danger);
        opacity: 1;
      }
      #status:empty {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <svg id="logo" viewBox="0 0 512 512" role="img" aria-label="Rumbo">
      <rect width="512" height="512" rx="112" fill="#6B2948" />
      <path
        d="M126 354V158h92c63 0 105 31 105 87 0 35-17 61-48 75l90 34h-94l-66-29v29h-79zm79-97h19c24 0 37-9 37-28s-13-27-37-27h-19v55z"
        fill="#FFF8F0"
      />
      <circle cx="365" cy="152" r="42" fill="#E3A72F" />
    </svg>
    <h1 id="title">Sin conexion</h1>
    <p id="lead">No pudimos cargar Rumbo. Puedes reintentar, o entrar y registrar gastos igual.</p>
    <button id="retry" type="button">
      <span id="spinner" aria-hidden="true"></span>
      <span id="label">Reintentar</span>
    </button>
    <!--
      Entrar sin conexion dejo de ser un callejon sin salida cuando la app
      aprendio a guardar los gastos en el aparato y subirlos despues. Antes
      llevaba a una pantalla vacia, y por eso esta pagina bloqueaba el paso.

      El destino es el sitio, no la copia que viaja dentro del APK: son origenes
      distintos, y el navegador guarda la sesion y los datos por origen. Abrir
      la copia local dejaria en una pantalla de inicio de sesion imposible de
      pasar sin red, y sin ninguno de los movimientos guardados.
    -->
    <button id="enter" type="button">Entrar sin conexion</button>
    <p id="status" role="status" aria-live="polite"></p>

    <script>
      var SITE = "https://rumbo-web-sepia.vercel.app";
      var TIMEOUT_MS = 8000;

      var button = document.getElementById("retry");
      var label = document.getElementById("label");
      // No llamar a esta variable `status`: en el ambito global choca con
      // window.status, que convierte lo que se le asigne en texto, y las
      // escrituras al elemento se pierden en silencio.
      var aviso = document.getElementById("status");

      /**
       * Comprueba si hay internet de verdad.
       *
       * No sirve para decidir si se deja entrar - eso ya lo decide quien pulsa
       * "Entrar sin conexion" - sino para no anunciar que se recupero la red
       * cuando no. El service worker del sitio responde igual con o sin
       * cobertura, asi que preguntarle a el no distingue nada; esta pagina vive
       * en otro origen, fuera de ese cache, y su peticion si toca la red real.
       *
       * `no-cors` porque solo interesa saber si la peticion llega a destino, no
       * leer la respuesta: el sitio no expone cabeceras CORS para este origen.
       * En una respuesta opaca el estado no se puede leer, pero un fallo de red
       * si rechaza la promesa, que es justo lo que hay que distinguir.
       */
      function hayInternet() {
        var control = new AbortController();
        var corte = setTimeout(function () {
          control.abort();
        }, TIMEOUT_MS);

        return fetch(SITE + "/icon.svg?_=" + Date.now(), {
          method: "GET",
          mode: "no-cors",
          cache: "no-store",
          signal: control.signal
        }).then(
          function () {
            clearTimeout(corte);
            return true;
          },
          function () {
            clearTimeout(corte);
            return false;
          }
        );
      }

      /**
       * Entrar sin red, contando con la copia que el sitio dejo guardada.
       *
       * Si no hay tal copia el WebView vuelve a fallar y aterriza otra vez
       * aqui, asi que el intento se apunta con su hora: al volver enseguida se
       * sabe que no fue un rebote cualquiera y se puede decir que paso, en vez
       * de dejar a alguien pulsando el mismo boton sin entender nada.
       */
      var ATTEMPT_KEY = "rumbo-offline-entry-attempt";
      var BOUNCE_WINDOW_MS = 20000;

      var enter = document.getElementById("enter");
      var lastAttempt = Number(localStorage.getItem(ATTEMPT_KEY) || 0);

      if (lastAttempt && Date.now() - lastAttempt < BOUNCE_WINDOW_MS) {
        localStorage.removeItem(ATTEMPT_KEY);
        document.getElementById("title").textContent = "No hay copia guardada";
        document.getElementById("lead").textContent =
          "Rumbo aun no habia guardado una copia en este telefono, asi que sin internet no puede abrir. Conectate una vez y quedara lista para la proxima.";
        enter.hidden = true;
      }

      enter.addEventListener("click", function () {
        localStorage.setItem(ATTEMPT_KEY, String(Date.now()));
        location.replace(SITE);
      });

      button.addEventListener("click", function () {
        if (button.getAttribute("aria-busy") === "true") return;

        button.setAttribute("aria-busy", "true");
        label.textContent = "Comprobando";
        aviso.textContent = "";

        hayInternet().then(function (conectado) {
          if (conectado) {
            label.textContent = "Abriendo";
            localStorage.removeItem(ATTEMPT_KEY);
            // replace y no href: evita que el boton Atras vuelva aqui.
            location.replace(SITE);
            return;
          }
          button.setAttribute("aria-busy", "false");
          label.textContent = "Reintentar";
          aviso.textContent = "Sigues sin conexion. Revisa el wifi o los datos moviles.";
        });
      });
    </script>
  </body>
</html>
