<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rumbo sin conexion</title>
    <style>
      :root {
        --plum: #6b2948;
        --cream: #fff8f0;
        --gold: #e3a72f;
        --ink: #3b2130;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
        background: var(--cream);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        text-align: center;
      }
      svg {
        width: 84px;
        height: 84px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.25;
        color: var(--plum);
      }
      p {
        margin: 0;
        max-width: 34ch;
        font-size: 16px;
        line-height: 1.5;
        opacity: 0.75;
      }
      a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        padding: 0 28px;
        border-radius: 999px;
        background: var(--plum);
        color: var(--cream);
        font-size: 16px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <svg viewBox="0 0 512 512" role="img" aria-label="Rumbo">
      <rect width="512" height="512" rx="112" fill="#6B2948" />
      <path
        d="M126 354V158h92c63 0 105 31 105 87 0 35-17 61-48 75l90 34h-94l-66-29v29h-79zm79-97h19c24 0 37-9 37-28s-13-27-37-27h-19v55z"
        fill="#FFF8F0"
      />
      <circle cx="365" cy="152" r="42" fill="#E3A72F" />
    </svg>
    <h1>Sin conexion</h1>
    <p>
      Rumbo necesita internet para mostrarte tus cuentas. Revisa tu conexion y vuelve a intentar.
    </p>
    <a href="https://rumbo-web-sepia.vercel.app">Reintentar</a>
  </body>
</html>
